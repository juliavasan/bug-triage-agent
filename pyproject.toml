[project]
name = "bug-triage-agent"
version = "0.1.0"
description = "AI-assisted bug triage: duplicate clustering, routing, severity, summaries and trends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openai>=1.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "rank-bm25>=0.2.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
triage = "triage.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
